#               (verified 2026-11-02). One net regression is allowed for noise in long tickets;
#               no newly missed escalation or critical ticket is allowed at all.
# BASELINE:     evaluation/baselines/dev_qwen7b.json (approved on answer key v2.0.0,
#               2026-11-02: all labels 0.57, critical 18/20, escalations 26/35, valid 0.99)
# =============================================================================
gate_id: dev_qwen7b
description: Production variant on the full dev split with qwen2.5:7b.
experiment_config: configs/experiments/gate_dev_qwen7b.yaml
prompt_version: v6_critical_triggers
model_name: "qwen2.5:7b"
min_schema_valid_rate: 0.95
max_net_regressions: 1
max_new_missed_escalations: 0
max_new_missed_critical: 0
