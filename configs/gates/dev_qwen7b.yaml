# =============================================================================
# FILE:         configs/gates/dev_qwen7b.yaml
# WHAT IT DOES: The strict local gate, run on your GPU before merging a prompt change:
#               the production variant on all 108 dev tickets with qwen2.5:7b.
# USE:          python -m evaluation.run_benchmark configs/experiments/gate_dev_qwen7b.yaml
#               python -m evaluation.regression_gate check configs/gates/dev_qwen7b.yaml
