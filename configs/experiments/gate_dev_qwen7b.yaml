# =============================================================================
experiment_id: gate_dev_qwen7b
description: Production variant on the full dev split with qwen2.5:7b, greedy decoding.
prompt_id: ticket_triage
prompt_versions: [v6_critical_triggers]
model_names: ["qwen2.5:7b"]
temperatures: [0.0]
seeds: [42]
dataset_path: evaluation/golden_datasets/ticket_triage/v2.jsonl
dataset_split: dev
max_concurrency: 2
compute_summary_similarity: false
