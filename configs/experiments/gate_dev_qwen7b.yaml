# =============================================================================
# FILE:         configs/experiments/gate_dev_qwen7b.yaml
# WHAT IT DOES: The local pre-merge gate experiment: the production variant on all 108 dev
#               tickets with qwen2.5:7b on the GPU. Stricter than CI, run before merging.
