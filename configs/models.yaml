# =============================================================================
# FILE:         configs/models.yaml
# WHAT IT DOES: Reference list of the models this project uses, with their sizes and roles.
# WHERE IT FITS: Documentation only: no code reads this file. Experiment configs name models
#               directly (model_names), and the runner passes the name to Ollama as is.
# COST:         all entries are local Ollama models — free.
# =============================================================================
models:
  qwen2.5:7b:
    backend: ollama
    context_window_tokens: 32768
    approx_size_gb: 4.7
    role: primary experiment model (fits an 8 GB GPU)
  llama3.1:8b:
    backend: ollama
    context_window_tokens: 131072
    approx_size_gb: 4.9
    role: second model family, for cross-model comparison
  qwen2.5:1.5b:
    backend: ollama
    context_window_tokens: 32768
    approx_size_gb: 1.0
    role: CI smoke canary (fast; structural breakage only)
