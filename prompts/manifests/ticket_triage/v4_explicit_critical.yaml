# =============================================================================
# FILE:         prompts/manifests/ticket_triage/v4_explicit_critical.yaml
# WHAT IT DOES: v3_fewshot with a rewritten policy that spells out what "critical" means.
# WHY:          The dev sweep (2026-11-01) rated only 15% of critical tickets as critical;
#               security exposures were never rated critical.
# HYPOTHESIS:   Concrete critical triggers (data loss, credentials/data exposure, a whole
#               service or endpoint down) plus a "re-check rule 1" instruction raise critical
#               recall without hurting the other urgency levels. Only the policy component
#               differs from v3.
# CHANGES:      1.0.1 (2026-11-02): outage narrowed to a WHOLE service/product/endpoint; one
#               function broken for everyone is high (guideline C1/C1b).
# =============================================================================
prompt_id: ticket_triage
version: 1.0.1
description: v3 plus an explicit critical definition in the policy. Tests critical recall.

system_components:
  - component_id: persona
    source_path: system/personas/support_triage_analyst.md
    xml_tag: role
  - component_id: policy
    source_path: system/policies/escalation_policy_explicit_critical.md
    xml_tag: policies
  - component_id: contract
    source_path: system/output_contracts/ticket_triage_contract.md
    xml_tag: output_contract

human_template:
  source_path: templates/ticket_triage/user_message.j2
  required_variables: [customer_tier, ticket_subject, ticket_body]

few_shot:
  source_path: fragments/ticket_triage/examples.yaml
  max_examples: 3

output_schema_ref: "prompt_engine.schemas.ticket_triage:TicketTriageResult"

default_generation:
  temperature: 0.0
  top_p: 1.0
  seed: 42
  max_output_tokens: 512
