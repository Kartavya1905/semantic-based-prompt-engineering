# =============================================================================
# FILE:         prompts/manifests/ticket_triage/v3_fewshot.yaml
# WHAT IT DOES: v1_baseline plus three worked examples.
# HYPOTHESIS:   Examples improve category accuracy and calibration, and teach the model to
#               ignore injected instructions (FS-002), at the price of a longer prompt.
#               Only few_shot differs from v1.
# =============================================================================
prompt_id: ticket_triage
version: 1.0.0
description: Baseline plus three few-shot examples (billing, injection, vague ticket).

system_components:
  - component_id: persona
    source_path: system/personas/support_triage_analyst.md
    xml_tag: role
  - component_id: policy
    source_path: system/policies/escalation_policy.md
    xml_tag: policies
  - component_id: contract
    source_path: system/output_contracts/ticket_triage_contract.md
    xml_tag: output_contract

human_template:
  source_path: templates/ticket_triage/user_message.j2
  required_variables: [customer_tier, ticket_subject, ticket_body]

few_shot:
  source_path: fragments/ticket_triage/examples.yaml
  max_examples: 3

output_schema_ref: "prompt_engine.schemas.ticket_triage:TicketTriageResult"

default_generation:
  temperature: 0.0
  top_p: 1.0
  seed: 42
  max_output_tokens: 512
