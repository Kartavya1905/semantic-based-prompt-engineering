# =============================================================================
# FILE:         prompts/manifests/ticket_triage/v1_baseline.yaml
# WHAT IT DOES: The reference prompt version every other variant is compared against.
# RECIPE:       role → policies → output_contract (+ output_schema, added by the composer)
# =============================================================================
prompt_id: ticket_triage
version: 1.0.0
description: Baseline. Persona first, then policies, then field definitions. No examples.

system_components:
  - component_id: persona
    source_path: system/personas/support_triage_analyst.md
    xml_tag: role
  - component_id: policy
    source_path: system/policies/escalation_policy.md
    xml_tag: policies
  - component_id: contract
    source_path: system/output_contracts/ticket_triage_contract.md
    xml_tag: output_contract

human_template:
  source_path: templates/ticket_triage/user_message.j2
  required_variables: [customer_tier, ticket_subject, ticket_body]

few_shot: null

output_schema_ref: "prompt_engine.schemas.ticket_triage:TicketTriageResult"

default_generation:
  temperature: 0.0
  top_p: 1.0
  seed: 42
  max_output_tokens: 512
