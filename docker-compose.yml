# =============================================================================
# FILE:         docker-compose.yml
# WHAT IT DOES: Runs the free local LLM server (Ollama) in Docker.
# USE:          docker compose up -d ollama
#               docker compose exec ollama ollama pull qwen2.5:7b
# GPU:          docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d ollama
# NOTE:         If another project's Ollama already listens on 11434, skip this and reuse it,
#               or install Ollama natively (https://ollama.com/download) — same URL either way.
# =============================================================================
services:
  ollama:
    image: ollama/ollama:0.12.6
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      # Parallel requests per model, so the async benchmark runner gets real concurrency.
      OLLAMA_NUM_PARALLEL: "4"
    volumes:
      - ollama_data:/root/.ollama

# Named volume = downloaded models survive container restarts.
volumes:
  ollama_data:
