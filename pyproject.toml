# =============================================================================
# FILE:         pyproject.toml
# WHAT IT DOES: Project metadata, the libraries it needs, and tool settings.
# INSTALL:      pip install -e ".[dev]"   (core + evaluation + test tools)
# =============================================================================

# --- How to build/install this project as a Python package ---
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-prompt-engine"
version = "0.1.0"  # Phase 0: repository scaffold
description = "Prompts as modular, versioned, schema-bound configurations with an evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
# --- Core libraries: the prompt engine itself (registry, composer, pipeline) ---
dependencies = [
    "pydantic>=2.7",                # output contracts + manifest validation
    "jinja2>=3.1",                  # human-turn templates
    "pyyaml>=6.0",                  # manifests, few-shot fragments, experiment configs
    "httpx>=0.27",                  # async HTTP client for Ollama
    "python-dotenv>=1.0",           # reads .env into environment variables
]

[project.optional-dependencies]
# Evaluation layer: benchmark analysis + local embeddings (no GPU, no API key).
eval = [
    "pandas>=2.2",                  # results tables + leaderboard
    "numpy>=1.26",                  # bootstrap resampling
    "scikit-learn>=1.5",            # macro-F1
    "statsmodels>=0.14",            # McNemar paired test
    "fastembed>=0.4",               # ONNX sentence embeddings for summary similarity
    "tabulate>=0.9",                # DataFrame.to_markdown()
]
# Everything needed to develop and test.
dev = [
    "semantic-prompt-engine[eval]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

# --- Tool settings ---
# src/ layout: only prompt_engine is packaged; evaluation/ runs from the repo root.
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]                  # lets tests import evaluation.*
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Everyday run skips tests that need a live Ollama server. Everything: pytest -m ""
addopts = "-q -m 'not llm'"
markers = ["llm: calls a real local model through Ollama (slow)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict_optional = true
ignore_missing_imports = true
