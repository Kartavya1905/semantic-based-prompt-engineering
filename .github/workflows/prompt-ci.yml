# =============================================================================
# FILE:         .github/workflows/prompt-ci.yml
# WHAT IT DOES: Two jobs on every push and pull request:
#               1. checks: lint, types, offline tests, schema snapshots, answer-key hash (~1 min)
#               2. prompt-gate: only when prompts/configs/code change. Runs the production prompt
#                  against the smoke tickets with a small local model, then the regression gate.
# COST:         Free: public repositories get unlimited GitHub Actions minutes; private ones get
#               2,000 free minutes a month. No API keys: the model runs on the CI machine.
# =============================================================================
name: prompt-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # --- 1. Everything that needs no model -----------------------------------------------------
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src scripts tests evaluation run_showcase.py
      - name: Unit tests (no model)
        run: pytest
      - name: Schema snapshots unchanged
        run: python scripts/update_schema_snapshots.py --check
      - name: Answer keys unchanged (v2 current, v1 kept for reproducing old results)
        run: |
          python -m evaluation.freeze_golden_dataset evaluation/golden_datasets/ticket_triage/v2.jsonl --check
          python -m evaluation.freeze_golden_dataset evaluation/golden_datasets/ticket_triage/v1.jsonl --check

  # --- 2. The regression gate with a real (small, local) model ------------------------------
  prompt-gate:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLLAMA_VERSION: "0.40.13"     # same as the development machine
      CI_MODEL: "qwen2.5:1.5b"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip unless prompts, configs or code changed
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qE '^(prompts|configs|src|evaluation)/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: steps.changes.outputs.run == 'true'
        run: pip install -e ".[dev]"
      - name: Cache the model download
        if: steps.changes.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.CI_MODEL }}-${{ env.OLLAMA_VERSION }}
      - name: Install and start Ollama
        if: steps.changes.outputs.run == 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # Serve from this user so the cached ~/.ollama/models is used.
          sudo systemctl stop ollama 2>/dev/null || true
          nohup ollama serve > ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:11434/api/version && break
            sleep 2
          done
          ollama pull "$CI_MODEL"
      - name: Run the CI experiment
        if: steps.changes.outputs.run == 'true'
        run: python -m evaluation.run_benchmark configs/experiments/ci_smoke.yaml
      - name: Regression gate
        if: steps.changes.outputs.run == 'true'
        run: python -m evaluation.regression_gate check configs/gates/ci_smoke.yaml
      - name: Keep the results for inspection or re-approval
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-results
          path: |
            evaluation/results/ci_smoke.jsonl
            ollama.log
          if-no-files-found: ignore
